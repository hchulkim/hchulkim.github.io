# ---------------------------------------------------------------------------
# Single source for every paper on the site. Both the front page (index.qmd)
# and the Research tab (research/index.qmd) render from this file through
# research/paper.ejs, so edit papers here only.
#
# Entries display in file order; numbers [n] are counted automatically
# (newest/first entry gets the highest number). Put new papers at the top
# of their section.
#
# Fields (all optional except title and section):
#   section:   working | publication | progress | other
#   title:     paper title
#   url:       link on the title (PDF, journal page, ...)
#   coauthors: list of {name, url}; url may be omitted
#   journal:   shown in italic red
#   note:      status / date text, e.g. "Submitted, June 2026" or "R&R, JPE"
#   year:      appended after the journal as ", 2024"
#   links:     list of {text, url}, shown on the line below the venue
#   abstract:  plain text; adds an "Abstract" toggle after the links
#   home:      false to hide the paper on the front page (default: shown)
#
# Site-internal files use absolute paths ("/research/...") so the same link
# works from both pages.
# ---------------------------------------------------------------------------

# Working papers --------------------------------------------------------------

- section: working
  title: "The China Shock and Internal Migration: Evidence from Bilateral Migration Flows"
  url: /research/working-paper/migration_china_shock.pdf
  coauthors:
    - name: Jaerim Choi
      url: https://sites.google.com/view/jaerimchoi
    - name: Seung Hoon Lee
      url: https://sites.google.com/view/seunghoon/home
  note: "Submitted, June 2026"
  abstract: >-
    Using Korean administrative data spanning nearly two decades and covering the universe of
    bilateral migration flows across local labor markets, we examine how the China trade shock
    shapes internal migration. While prior studies rely on net population changes to measure
    labor adjustment, we exploit bilateral migration flows that separately capture in- and
    out-migration. We find that trade exposure primarily increases out-migration from adversely
    affected regions, with limited effects on in-migration, revealing asymmetric spatial
    adjustment. Decomposing the shock, export expansion reduces out-migration, whereas import
    competition increases it. Migration responses are strongest among prime working-age
    individuals and substantially weaker among younger and older cohorts. Single-person
    households are more responsive than multi-person households. Overall, bilateral data reveal
    substantial migration responses that conventional net population measures fail to detect,
    offering new insight into the "missing migration puzzle."
  links:
    - text: Replication
      url: https://github.com/hchulkim/research_china-shock-migration

